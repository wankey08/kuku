<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>色号查询 - 色卡查询工具</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>🎨 色号查询</h1>
  <p class="sub">支持搜索色号 / 名称 / Hex · 上传照片取色匹配最近色号</p>
</header>

<div class="toolbar">
  <input id="search" type="text" placeholder="输入色号、名称或 Hex，如：胭脂 / H030 / #FF461F">
  <div class="filters" id="filters"></div>
</div>

<section class="photo-box">
  <h2>📷 照片取色匹配</h2>
  <div class="photo-actions">
    <label class="btn">
      拍照
      <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
    </label>
    <label class="btn">
      选取照片
      <input id="photoInput" type="file" accept="image/*" hidden>
    </label>
    <span class="hint">上传后点击照片中的颜色，自动匹配最接近的色号</span>
  </div>
  <div class="photo-area" id="photoArea" hidden>
    <canvas id="canvas"></canvas>
    <div class="picked" id="picked" hidden>
      <div class="picked-color" id="pickedColor"></div>
      <div class="picked-info" id="pickedInfo"></div>
    </div>
  </div>
  <div class="matches" id="matches"></div>
</section>

<section>
  <div class="grid" id="grid"></div>
</section>

<div class="toast" id="toast"></div>

<footer>
  Pantone 数据为社区近似值，仅供参考；印刷请以官方实物色卡为准。
</footer>

<script src="app.js"></script>
</body>
</html>
